<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conspectus</title>
<meta name="description" content="Search the medical literature and see what kind of evidence answers your question — every paper placed by study design and publication era, from Europe PMC.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
<!-- Relative, because the site is served from /Conspectus/ and an absolute /brand/… would
     resolve to the account root and 404. -->
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.ebi.ac.uk">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sr" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10.2" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
    <circle cx="12" cy="12" r="6.4" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>
    <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/>
  </symbol>
  <symbol id="i-books" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9a1.5 1.5 0 0 1 1.5 1.5V20H5.5A1.5 1.5 0 0 1 4 18.5z"/>
    <path d="M10.5 7.5 14 6.6a1.5 1.5 0 0 1 1.84 1.06l3 11.2"/>
    <path d="M7.2 8.4h.1M7.2 12h.1"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v6M12 16.6h.01"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v12M7.5 11 12 15.5 16.5 11M4 20h16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.4A1.6 1.6 0 0 0 9 21h6a1.6 1.6 0 0 0 1.6-1.6L17.5 7"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4.5V11h-6.2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10.5 13.5a4 4 0 0 0 5.66 0l2.6-2.6a4 4 0 0 0-5.66-5.66l-1.3 1.3"/><path d="M13.5 10.5a4 4 0 0 0-5.66 0l-2.6 2.6a4 4 0 0 0 5.66 5.66l1.3-1.3"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1 5.5 18.5"/></symbol>
</svg>

<aside class="sidebar">
  <button class="brand" id="home-side" type="button" title="Start a new search">
    <svg class="brand-mark" aria-hidden="true"><use href="#i-mark"/></svg>
    <span class="brand-name">Conspectus</span>
  </button>
  <div class="side-scroll">
    <nav class="nav" aria-label="Sections">
      <button class="nav-item" data-go="search"><svg aria-hidden="true"><use href="#i-search"/></svg>Search</button>
      <button class="nav-item" data-go="list"><svg aria-hidden="true"><use href="#i-books"/></svg>Reading list<span class="nav-count" id="c-list"></span></button>
      <button class="nav-item" data-go="about"><svg aria-hidden="true"><use href="#i-info"/></svg>How it ranks</button>
    </nav>
    <div id="recent-block"></div>
  </div>
  <div class="side-foot" id="side-foot"></div>
</aside>

<div class="content">
  <header class="topbar">
    <button class="side-toggle" id="side-toggle" type="button" aria-label="Hide the sidebar" title="Hide the sidebar" aria-expanded="true">
      <svg aria-hidden="true"><use href="#i-panel"/></svg>
    </button>
    <button class="brand-compact" id="home-top" type="button" title="Start a new search"><svg aria-hidden="true"><use href="#i-mark"/></svg>Conspectus</button>
    <label class="field">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr">Filter your reading list</span>
      <input id="q-list" type="search" placeholder="Filter reading list" autocomplete="off">
      <button class="field-clear" id="q-list-clear" hidden type="button" aria-label="Clear filter">
        <svg style="width:14px;height:14px" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </label>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch appearance" title="Switch appearance">
      <svg aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
  </header>

  <main class="scroll" id="scroll">
    <div class="wrap" id="view-search"></div>
    <div class="wrap" id="view-list" hidden></div>
    <div class="wrap wrap-narrow" id="view-about" hidden></div>
    <div class="wrap wrap-narrow" id="view-privacy" hidden></div>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-go="search"><svg aria-hidden="true"><use href="#i-search"/></svg>Search</button>
    <button class="tab" data-go="list"><svg aria-hidden="true"><use href="#i-books"/></svg>Reading list</button>
    <button class="tab" data-go="about"><svg aria-hidden="true"><use href="#i-info"/></svg>Ranking</button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="cite.js"></script>
<!-- A module, so it can import the classifier from classify.js. Modules are deferred and
     run after the three classic scripts above, which is the order app.js needs. -->
<script type="module" src="app.js"></script>
</body>
</html>
